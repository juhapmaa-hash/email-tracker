<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vastausta odottavat v1.4</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f7f5f0;
    color: #1c1c1e;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    border-bottom: 2px solid #1c1c1e;
    padding-bottom: 10px;
  }
  .accent { color: #c0392b; }
  button {
    background: #1c1c1e;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    margin: 4px;
  }
  button:disabled { background: #999; }
  select {
    padding: 8px;
    font-size: 14px;
    margin: 4px;
  }
  .log {
    background: #1c1c1e;
    color: #0f0;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    border-radius: 4px;
    margin-top: 20px;
    min-height: 100px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .email-row {
    background: #fff;
    border-left: 4px solid #2980b9;
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 0 6px 6px 0;
  }
  .urgent { border-left-color: #c0392b; }
  .waiting { border-left-color: #e67e22; }
  .email-subject { font-weight: bold; font-size: 16px; }
  .email-meta { font-size: 12px; color: #666; margin-top: 4px; }
  .age { float: right; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>

<h1>Vastausta <span class="accent">odottavat</span> <span style="font-size:12px;color:#999;font-weight:normal;">v1.4</span></h1>

<div id="login-area">
  <p>Kirjaudu Microsoft-tilillä jatkaaksesi:</p>
  <button onclick="doSignIn()">🔑 Kirjaudu sisään</button>
</div>

<div id="app-area" style="display:none;">
  <p>Kirjautunut: <strong id="user-name"></strong></p>
  <label>Hae viimeiseltä:
    <select id="days">
      <option value="7">7 päivää</option>
      <option value="14" selected>14 päivää</option>
      <option value="30">30 päivää</option>
    </select>
  </label>
  <button onclick="fetchEmails()" id="fetch-btn">📧 Hae sähköpostit</button>
  <button onclick="doSignOut()">Kirjaudu ulos</button>
  <div id="results"></div>
</div>

<div class="log" id="log">Lataa sivua...</div>

<script>
const VERSION = "1.4";

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n' + msg;
  console.log(msg);
}

window.addEventListener('error', (e) => {
  log('VIRHE: ' + e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
});

log('Versio ' + VERSION + ' | Sivu ladattu. Yritetään ladata MSAL...');
</script>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
        onload="log('MSAL ladattu')"
        onerror="log('MSAL EI LATAUTUNUT')"></script>

<script>
const CONFIG = {
  auth: {
    clientId: "c9ab03f3-a6ab-457a-a28a-8e55d2fdc74b",
    authority: "https://login.microsoftonline.com/13bef141-1ef7-4c1f-9a84-1944206b7af6",
    redirectUri: window.location.href.split('?')[0].split('#')[0]
  },
  cache: { cacheLocation: "sessionStorage" }
};
const SCOPES = ["Mail.Read", "User.Read"];

let pca = null;
let account = null;

window.addEventListener('load', async () => {
  try {
    log('Redirect URI: ' + CONFIG.auth.redirectUri);
    if (typeof msal === 'undefined') {
      log('FAIL: msal-objekti puuttuu');
      return;
    }
    pca = new msal.PublicClientApplication(CONFIG);
    log('MSAL alustettu OK');

    const resp = await pca.handleRedirectPromise();
    if (resp && resp.account) {
      account = resp.account;
      log('Kirjautunut: ' + account.username);
      showApp();
    } else {
      const accs = pca.getAllAccounts();
      if (accs.length > 0) {
        account = accs[0];
        log('Aiempi tili: ' + account.username);
        showApp();
      } else {
        log('Ei kirjautumista. Paina nappia.');
      }
    }
  } catch (e) {
    log('ALUSTUSVIRHE: ' + e.message);
  }
});

async function doSignIn() {
  try {
    log('Yritetaan kirjautua popup-tavalla...');
    if (!pca) {
      log('MSAL ei alustettu');
      return;
    }
    const resp = await pca.loginPopup({ scopes: SCOPES });
    account = resp.account;
    log('Kirjauduttu: ' + account.username);
    showApp();
  } catch (e) {
    log('POPUP VIRHE: ' + e.message);
    log('Yritetaan redirect...');
    try {
      await pca.loginRedirect({ scopes: SCOPES });
    } catch (e2) {
      log('REDIRECT VIRHE: ' + e2.message);
    }
  }
}

async function doSignOut() {
  try {
    await pca.logoutPopup();
  } catch (e) {
    log('Logout: ' + e.message);
  }
  account = null;
  document.getElementById('login-area').style.display = 'block';
  document.getElementById('app-area').style.display = 'none';
}

function showApp() {
  document.getElementById('login-area').style.display = 'none';
  document.getElementById('app-area').style.display = 'block';
  document.getElementById('user-name').textContent = account.username;
}

async function getToken() {
  try {
    const r = await pca.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch (e) {
    log('Silent token failed, popup...');
    const r = await pca.acquireTokenPopup({ scopes: SCOPES });
    return r.accessToken;
  }
}

async function fetchEmails() {
  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  document.getElementById('results').innerHTML = '';
  try {
    const token = await getToken();
    log('Token saatu');
    const days = parseInt(document.getElementById('days').value);
    const since = new Date(Date.now() - days*864e5).toISOString();

    log('Haetaan lähetettyjä...');
    const sentRes = await fetch(
      'https://graph.microsoft.com/v1.0/me/mailFolders/SentItems/messages?$top=50&$filter=sentDateTime ge ' + since + '&$select=id,subject,toRecipients,sentDateTime,conversationId,bodyPreview&$orderby=sentDateTime desc',
      { headers: { Authorization: 'Bearer ' + token } }
    );
    if (!sentRes.ok) throw new Error('Graph API: ' + sentRes.status);
    const sentData = await sentRes.json();
    const sent = sentData.value || [];
    log('Löytyi ' + sent.length + ' lähetettyä viestiä');

    const myDomain = account.username.split('@')[1].toLowerCase();
    log('Oma domain: ' + myDomain);

    let skipReply = 0, skipTeams = 0, skipInternal = 0, skipNoRecipient = 0;

    const unreplied = [];
    for (let i = 0; i < sent.length; i++) {
      const msg = sent[i];
      const subject = msg.subject || '';
      if (/^(RE:|FW:|FWD:|VS:|SV:)/i.test(subject)) { skipReply++; continue; }

      // Skip Teams/calendar invitations
      const preview = (msg.bodyPreview || '').toLowerCase();
      if (/microsoft teams meeting|teams-kokous|join the meeting|liity kokoukseen|________________________________________________________________________/i.test(preview)) { skipTeams++; continue; }
      if (/^(invitation|kutsu|kalenterikutsu|meeting:|canceled:|peruttu:)/i.test(subject)) { skipTeams++; continue; }

      // At least one external recipient
      const recipients = msg.toRecipients || [];
      if (recipients.length === 0) { skipNoRecipient++; continue; }
      const hasExternal = recipients.some(r => {
        const addr = (r.emailAddress && r.emailAddress.address || '').toLowerCase();
        if (!addr) return false;
        const domain = addr.split('@')[1] || '';
        if (domain === myDomain) return false;
        if (/noreply|no-reply|notifications?|mailer-daemon|donotreply/i.test(addr)) return false;
        return true;
      });
      if (!hasExternal) { skipInternal++; continue; }

      const convRes = await fetch(
        "https://graph.microsoft.com/v1.0/me/messages?$filter=conversationId eq '" + msg.conversationId + "'&$select=from,sentDateTime&$top=20",
        { headers: { Authorization: 'Bearer ' + token } }
      );
      const convData = await convRes.json();
      const hasReply = (convData.value || []).some(m => {
        const f = m.from && m.from.emailAddress && m.from.emailAddress.address ? m.from.emailAddress.address.toLowerCase() : '';
        return f !== account.username.toLowerCase();
      });
      if (!hasReply) {
        const sentDate = new Date(msg.sentDateTime);
        unreplied.push({
          subject: msg.subject || '(ei aihetta)',
          to: msg.toRecipients ? msg.toRecipients.map(r => r.emailAddress.address).join(', ') : '',
          date: sentDate.toLocaleDateString('fi-FI'),
          daysSince: Math.floor((Date.now() - sentDate) / 864e5),
          snippet: msg.bodyPreview ? msg.bodyPreview.slice(0, 100) : ''
        });
      }
    }
    unreplied.sort((a, b) => b.daysSince - a.daysSince);
    log('Vastausta odottaa: ' + unreplied.length);
    renderResults(unreplied);
  } catch (e) {
    log('HAKUVIRHE: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

let lastResults = [];

function copyToClipboard() {
  if (lastResults.length === 0) return;
  const text = 'Vastausta odottavat sähköpostit:\n\n' +
    lastResults.map(e => `• ${e.subject}\n  → ${e.to}\n  Lähetetty: ${e.date} (${e.daysSince} pv sitten)`).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    log('✓ Lista kopioitu leikepöydälle');
    alert('Lista kopioitu! Voit nyt liittää sen Claudeen.');
  }).catch(e => log('Kopiointi ei onnistunut: ' + e.message));
}

function renderResults(list) {
  lastResults = list;
  const el = document.getElementById('results');
  if (list.length === 0) {
    el.innerHTML = '<p>✅ Kaikki vastattu!</p>';
    return;
  }
  let html = '<h2>' + list.length + ' viestiä ilman vastausta <button onclick="copyToClipboard()" style="font-size:12px;padding:6px 12px;margin-left:10px;">📋 Kopioi lista</button></h2>';
  for (const e of list) {
    const cls = e.daysSince >= 14 ? 'urgent' : e.daysSince >= 7 ? 'waiting' : '';
    html += '<div class="email-row ' + cls + '">' +
      '<span class="age">' + e.daysSince + ' pv</span>' +
      '<div class="email-subject">' + e.subject + '</div>' +
      '<div class="email-meta">→ ' + e.to + ' · ' + e.date + '</div>';
    if (e.snippet) {
      html += '<div class="email-meta" style="margin-top:6px;font-style:italic">' + e.snippet + '</div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}
</script>
</body>
</html>
